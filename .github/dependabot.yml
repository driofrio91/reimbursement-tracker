version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 4
    labels:
      - dependencies
    groups:
      npm-prisma-minor-patch:
        patterns:
          - "prisma"
          - "@prisma/client"
        update-types:
          - minor
          - patch
      npm-runtime-minor-patch:
        patterns:
          - "@radix-ui/*"
          - "bcryptjs"
          - "next"
          - "next-auth"
          - "react"
          - "react-dom"
          - "sonner"
          - "zod"
        update-types:
          - minor
          - patch
      npm-tooling-minor-patch:
        patterns:
          - "*"
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-prisma-major:
        patterns:
          - "prisma"
          - "@prisma/client"
        update-types:
          - major
      npm-runtime-major:
        patterns:
          - "next"
          - "next-auth"
          - "react"
          - "react-dom"
          - "zod"
        update-types:
          - major
      npm-tooling-major:
        patterns:
          - "*"
        dependency-type: development
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 2
    labels:
      - dependencies
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major
